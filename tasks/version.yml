version: "3"

tasks:
  show:
    desc: Print current app version from version.json
    cmds:
      - |
        echo "Marketing: $(jq -r .marketingVersion version.json)"
        echo "Build:     $(jq -r .buildNumber version.json)"

  sync:
    desc: Sync version.json to Xcode project and AppVersion.swift
    cmds:
      - task: sync:swift
      - task: sync:xcode
      - echo "✅ Version synced from version.json"

  sync:swift:
    internal: true
    cmds:
      - |
        MARKETING=$(jq -r .marketingVersion version.json)
        BUILD=$(jq -r .buildNumber version.json)
        cat > MagSafeGuardLib/Sources/MagSafeGuardCore/Utilities/AppVersion.swift <<EOF
        // Generated by: task version:sync — edit version.json, then sync.
        import Foundation

        public enum AppVersion {
          /// User-facing semver (e.g. 0.2.0)
          public static let marketing = "$MARKETING"
          /// Build number (integer, increments per release)
          public static let build = $BUILD
          /// Display string for About / diagnostics
          public static var full: String { "\(marketing) (\(build))" }
        }
        EOF

  sync:xcode:
    internal: true
    cmds:
      - |
        MARKETING=$(jq -r .marketingVersion version.json)
        BUILD=$(jq -r .buildNumber version.json)
        sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $MARKETING/g" MagSafeGuard.xcodeproj/project.pbxproj
        sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $BUILD/g" MagSafeGuard.xcodeproj/project.pbxproj

  bump:patch:
    desc: Bump patch version (0.2.0 → 0.2.1) and sync
    cmds:
      - |
        python3 - <<'PY'
        import json
        from pathlib import Path
        data = json.loads(Path("version.json").read_text())
        major, minor, patch = (int(x) for x in data["marketingVersion"].split("."))
        data["marketingVersion"] = f"{major}.{minor}.{patch + 1}"
        data["buildNumber"] = int(data["buildNumber"]) + 1
        Path("version.json").write_text(json.dumps(data, indent=2) + "\n")
        PY
      - task: sync

  bump:minor:
    desc: Bump minor version (0.2.0 → 0.3.0) and sync
    cmds:
      - |
        python3 - <<'PY'
        import json
        from pathlib import Path
        data = json.loads(Path("version.json").read_text())
        major, minor, _patch = (int(x) for x in data["marketingVersion"].split("."))
        data["marketingVersion"] = f"{major}.{minor + 1}.0"
        data["buildNumber"] = int(data["buildNumber"]) + 1
        Path("version.json").write_text(json.dumps(data, indent=2) + "\n")
        PY
      - task: sync
